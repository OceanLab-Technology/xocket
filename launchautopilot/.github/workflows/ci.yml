name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Turborepo compares against the base commit for affected-only runs.
          fetch-depth: 0

      # No version input — the action reads packageManager from package.json,
      # and passing both is an error.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Uncomment whichever services/ languages this repo uses.
      # - uses: actions/setup-go@v7
      #   with: { go-version: '1.24' }
      # - uses: dtolnay/rust-toolchain@stable
      # - uses: astral-sh/setup-uv@v10

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Source-map upload needs a token; skipped on PRs from forks.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Check formatting
        run: pnpm format:check
