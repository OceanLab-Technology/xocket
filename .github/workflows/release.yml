name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack, but do not publish
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag must match package.json, and the full test suite must pass, before
  # anything is published. A bad publish cannot be taken back — only deprecated.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Tag and package.json must agree
        id: version
        run: |
          set -eu
          PKG=$(node -p "require('./package.json').version")
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$PKG" ]; then
              echo "::error::Tag v$TAG does not match package.json version $PKG"
              exit 1
            fi
          fi
          echo "Releasing $PKG"

      - name: The tarball must carry the templates
        run: |
          set -eu
          pnpm pack --pack-destination /tmp >/dev/null
          TGZ=$(ls /tmp/xocket-*.tgz)
          for f in \
            package/dist/index.js \
            package/templates/react/package.json \
            package/templates/next/package.json \
            package/templates/expo/package.json; do
            tar -tzf "$TGZ" | grep -qx "$f" || { echo "::error::missing $f"; exit 1; }
          done
          echo "Tarball contents OK"

      - name: Build the standalone tarball
        run: pnpm build:standalone

      # Stage both artifacts into one flat directory. Uploading several globs
      # from different roots makes the artifact's internal layout depend on
      # their common ancestor, which consumers then have to guess at.
      - name: Stage release artifacts
        run: |
          set -eux
          mkdir -p artifacts
          cp /tmp/xocket-*.tgz artifacts/
          cp build/xocket-*.tar.gz artifacts/
          cp build/xocket-*.tar.gz.sha256 artifacts/
          ls -l artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: artifacts/

  # A published CLI has to produce a working project, not merely install. This
  # installs the real tarball and scaffolds with it.
  smoke:
    name: Smoke-test the tarball
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        framework: [react, next]
    steps:
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: /tmp/pkg

      - name: Install the tarball globally and scaffold with it
        run: |
          set -eu
          npm install -g /tmp/pkg/xocket-*.tgz
          cd "${{ runner.temp }}"
          xocket create smoke-app --yes --no-git \
            -f ${{ matrix.framework }} -s zustand -b supabase --ai-seo

      - name: Every gate must pass
        run: |
          pnpm lint
          pnpm type-check
          pnpm test
          pnpm build
        working-directory: ${{ runner.temp }}/smoke-app

  # The install script is what `curl | sh` runs on a stranger's machine, so it
  # gets linted and exercised against the real artifact before release.
  installer:
    name: Install script
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The installed CLI shells out to pnpm, and so does the project it
      # generates — its preflight refuses to run without it.
      #
      # No `version:` input here: this job checks the repo out, so the action
      # reads packageManager from package.json, and supplying both is an error.
      # The smoke jobs do pass it, because they never check the repo out.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: /tmp/pkg

      - name: Lint the installer
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -s sh scripts/install.sh
          # It must also parse under dash, not just bash.
          dash -n scripts/install.sh

      - name: Install from a local release and scaffold with it
        run: |
          set -eux
          mkdir -p srv/releases/download/v"$VERSION"
          cp /tmp/pkg/xocket-"$VERSION".tar.gz srv/releases/download/v"$VERSION"/
          cp /tmp/pkg/xocket-"$VERSION".tar.gz.sha256 srv/releases/download/v"$VERSION"/
          (cd srv && python3 -m http.server 8799 &)
          sleep 2

          sed 's|https://github.com/${REPO}/releases/download|http://localhost:8799/releases/download|' \
            scripts/install.sh > /tmp/install-local.sh

          XOCKET_VERSION="$VERSION" \
          XOCKET_INSTALL="$HOME/.local/share/xocket" \
          XOCKET_BIN="$HOME/.local/bin" \
            sh /tmp/install-local.sh

          export PATH="$HOME/.local/bin:$PATH"
          test "$(xocket --version)" = "$VERSION"

          cd "$(mktemp -d)"
          xocket create installed-app --yes --no-git -f next -s zustand -b supabase --ai-seo
          cd installed-app
          pnpm lint && pnpm type-check && pnpm build && pnpm test
        env:
          VERSION: ${{ needs.verify.outputs.version }}

      - name: A tampered download must be refused
        run: |
          set -eux
          printf 'corrupted' >> srv/releases/download/v"$VERSION"/xocket-"$VERSION".tar.gz
          if XOCKET_VERSION="$VERSION" \
             XOCKET_INSTALL="$HOME/.local/share/xocket2" \
             XOCKET_BIN="$HOME/.local/bin2" \
               sh /tmp/install-local.sh; then
            echo "::error::the installer accepted a tampered tarball"
            exit 1
          fi
        env:
          VERSION: ${{ needs.verify.outputs.version }}

  # Deliberately independent of npm. The install script downloads its tarball
  # from the GitHub release, so coupling the two would mean a missing npm
  # credential also breaks `curl | sh`.
  release:
    name: GitHub release
    needs: [verify, smoke, installer]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: package
          path: /tmp/pkg

      - name: Publish the release with the install tarball attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -eux
          # Written to a file so the fenced block does not have to survive YAML.
          {
            printf 'See [CHANGELOG.md](https://github.com/%s/blob/main/CHANGELOG.md) for the full list of changes.\n\n' "$REPO"
            printf '## Install\n\n'
            printf '```bash\n'
            printf 'curl -fsSL https://get.xocket.sh | sh\n'
            printf '```\n\n'
            printf 'Or without installing:\n\n'
            printf '```bash\n'
            printf 'npx xocket@%s create my-app\n' "$VERSION"
            printf '```\n'
          } > notes.md

          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file notes.md \
            --verify-tag \
            "/tmp/pkg/xocket-$VERSION.tar.gz" \
            "/tmp/pkg/xocket-$VERSION.tar.gz.sha256"

  publish:
    name: Publish to npm
    needs: [verify, smoke, installer]
    if: github.ref_type == 'tag' || inputs.dry_run == false
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/xocket
    permissions:
      contents: write
      # Required for npm provenance and for trusted publishing (OIDC).
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # The install script downloads these from the release created below.
      - name: Build the standalone tarball
        run: pnpm build:standalone

      - name: Publish
        # With Trusted Publishing configured on npmjs.com this needs no token —
        # npm verifies the OIDC identity of this workflow instead. NODE_AUTH_TOKEN
        # is the fallback for repos that have not set that up.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
